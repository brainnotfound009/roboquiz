<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboQuiz | Applications of Robotics</title>
<style>
:root{
  --bg:#07111f; --card:rgba(13,29,50,.88); --cyan:#4deaff;
  --purple:#9b7bff; --text:#eef7ff; --muted:#9db3c9;
  --good:#43e6a5; --bad:#ff6d8d;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text); background:
  radial-gradient(circle at 10% 10%,#17366a 0,transparent 32%),
  radial-gradient(circle at 90% 85%,#35185b 0,transparent 35%),var(--bg);
  display:flex; justify-content:center; padding:22px;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
  background-image:linear-gradient(#4deaff18 1px,transparent 1px),linear-gradient(90deg,#4deaff18 1px,transparent 1px);
  background-size:34px 34px;
}
.app{width:min(900px,100%); position:relative}
header{text-align:center;margin:12px 0 22px}
.badge{display:inline-block;padding:7px 14px;border:1px solid #4deaff66;border-radius:999px;color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,58px);margin:14px 0 8px;line-height:1.05}
h1 span{color:var(--cyan);text-shadow:0 0 22px #4deaff66}
.subtitle{color:var(--muted);margin:0;font-size:15px}
.panel{background:var(--card);border:1px solid #ffffff18;border-radius:26px;box-shadow:0 18px 60px #0006;backdrop-filter:blur(14px);padding:25px}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;font-size:13px;color:var(--muted)}
.progress{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-bottom:24px}
.progress i{display:block;height:100%;width:8.33%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:99px;transition:.3s}
.robotrow{display:flex;gap:17px;align-items:center;margin-bottom:22px}
.robot{
 width:92px;height:92px;flex:0 0 92px;border-radius:27px;
 display:grid;place-items:center;font-size:52px;
 background:linear-gradient(145deg,#173d5e,#291c54);border:1px solid #4deaff55;
 box-shadow:0 0 28px #4deaff18;
}
.speech{position:relative;background:#ffffff09;border:1px solid #ffffff18;border-radius:18px;padding:15px 18px;flex:1}
.speech:before{content:"";position:absolute;left:-9px;top:28px;width:16px;height:16px;background:#14273d;border-left:1px solid #ffffff18;border-bottom:1px solid #ffffff18;transform:rotate(45deg)}
.speech strong{color:var(--cyan);font-size:13px}
.speech p{margin:5px 0 0;line-height:1.5}
.topic{display:inline-block;color:#d5c8ff;background:#9b7bff18;border:1px solid #9b7bff44;border-radius:999px;padding:6px 11px;font-size:12px;margin-bottom:13px}
.question{font-size:clamp(20px,3vw,28px);line-height:1.3;margin:0 0 20px}
.answers{display:grid;gap:11px}
.answer{
  width:100%;text-align:left;color:var(--text);background:#ffffff07;border:1px solid #ffffff1c;
  padding:15px 16px;border-radius:15px;cursor:pointer;font-size:15px;transition:.2s;
  display:flex;align-items:center;gap:12px;
}
.answer .letter{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:#ffffff0d;color:var(--cyan);font-weight:700;flex:0 0 29px}
.answer:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);background:#4deaff0d}
.answer.correct{border-color:var(--good);background:#43e6a512}
.answer.wrong{border-color:var(--bad);background:#ff6d8d12}
.answer:disabled{cursor:default}
.feedback{min-height:25px;margin:17px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
button.primary{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(90deg,var(--cyan),#8b8bff);color:#06101e;font-weight:800;cursor:pointer}
button.primary:disabled{opacity:.35;cursor:not-allowed}
button.secondary{border:1px solid #ffffff22;background:#ffffff08;color:var(--text);border-radius:999px;padding:12px 18px;cursor:pointer}
.score{font-weight:800;color:var(--cyan)}
.hidden{display:none}
.result{text-align:center;padding:20px 5px}
.result .big{font-size:70px}
.result h2{font-size:32px;margin:8px 0}
.result p{color:var(--muted);line-height:1.6}
.review{margin-top:20px;text-align:left;border-top:1px solid #ffffff18;padding-top:16px}
.review div{padding:10px 0;border-bottom:1px solid #ffffff10;font-size:14px;line-height:1.5}
footer{text-align:center;color:#7f97ad;font-size:12px;margin:17px 0}
@media(max-width:520px){body{padding:12px}.panel{padding:18px;border-radius:20px}.robot{width:70px;height:70px;flex-basis:70px;font-size:40px}.robotrow{gap:12px}.speech{padding:12px}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body>
<main class="app">
<header>
  <span class="badge">B.Tech • First Year • Interactive Quiz</span>
  <h1>ROBO<span>QUIZ</span> 🤖</h1>
  <p class="subtitle">Explore how robots are changing the world.</p>
</header>

<section class="panel" id="quizPanel">
  <div class="topline"><span id="counter">QUESTION 01 / 12</span><span class="score" id="score">SCORE: 0</span></div>
  <div class="progress"><i id="progress"></i></div>
  <div class="robotrow">
    <div class="robot">🤖</div>
    <div class="speech"><strong>ROBO ASSISTANT</strong><p id="speech">Hello, future engineers! Let's test your robotics knowledge.</p></div>
  </div>
  <span class="topic" id="topic">SMART MANUFACTURING</span>
  <h2 class="question" id="question"></h2>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="actions">
    <button class="secondary" id="restart" onclick="restartQuiz()">↻ Restart</button>
    <button class="primary" id="next" onclick="nextQuestion()" disabled>Next Question →</button>
  </div>
</section>

<section class="panel result hidden" id="resultPanel">
  <div class="name-box" style="margin:18px 0;padding:16px;border:1px solid rgba(255,255,255,.15);border-radius:16px;background:rgba(255,255,255,.05);">
    <label for="scoreName" style="display:block;margin-bottom:8px;font-weight:700;">Enter your name or nickname</label>
    <input id="scoreName" type="text" maxlength="50" placeholder="Your name"
      style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #4deaff;background:#07111f;color:#eef7ff;font-size:16px;">
    <button class="primary" id="submitScoreBtn" type="button" onclick="submitScore()" style="margin-top:12px;width:100%;">
      Submit Score
    </button>
    <div id="submitStatus" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="big">🏆</div>
  <h2>Mission Complete!</h2>
  <p id="resultText"></p>
  <button class="primary" onclick="restartQuiz()">Try Again ↻</button>
  <div class="review" id="review"></div>
</section>
<footer>Built for curious minds • Learn. Think. Innovate.</footer>
</main>

<script>
const questions = [
 {topic:"SMART MANUFACTURING",q:"What is the main purpose of robots in smart manufacturing?",a:["To increase errors","To automate and improve production","To replace all computers","To stop production"],c:1,e:"Industrial robots can automate repetitive tasks and improve productivity, consistency, and safety."},
 {topic:"SMART MANUFACTURING",q:"Which technology helps robots communicate with machines and sensors in a smart factory?",a:["Internet of Things (IoT)","Typewriter","Film camera","Analog clock"],c:0,e:"IoT connects machines, sensors, and systems so they can share data and work together."},
 {topic:"SMART MANUFACTURING",q:"A robot repeatedly picks and places objects on a conveyor belt. Which task is this?",a:["Natural language translation","Pick-and-place automation","Weather forecasting","Medical diagnosis"],c:1,e:"Pick-and-place robots move objects from one location to another with speed and precision."},
 {topic:"SMART MANUFACTURING",q:"How can robots improve worker safety in factories?",a:["By creating more hazards","By performing dangerous or repetitive tasks","By removing all safety systems","By increasing manual lifting"],c:1,e:"Robots can handle hazardous materials, heavy lifting, and repetitive work when properly designed and supervised."},
 {topic:"HEALTHCARE",q:"Which is an example of robotics in healthcare?",a:["Robot-assisted surgery","Printing a textbook","Making a calculator","Drawing a poster"],c:0,e:"Robot-assisted surgical systems can help surgeons perform precise movements."},
 {topic:"HEALTHCARE",q:"What is the purpose of a rehabilitation robot?",a:["To help patients regain movement","To manufacture cars","To monitor traffic lights","To sort online comments"],c:0,e:"Rehabilitation robots support physical therapy and help patients practice controlled movements."},
 {topic:"HEALTHCARE",q:"A hospital robot delivers medicines and supplies. What is its key benefit?",a:["Increasing delivery delays","Supporting staff and reducing routine workload","Replacing every doctor","Avoiding all human supervision"],c:1,e:"Delivery robots can transport supplies efficiently, allowing healthcare workers to focus on patient care."},
 {topic:"HEALTHCARE",q:"Why are safety and accuracy especially important in medical robotics?",a:["Because mistakes can affect patients","Because robots never use sensors","Because hospitals have no rules","Because speed is the only goal"],c:0,e:"Medical robots operate in sensitive environments, so accuracy, testing, safety, and human oversight are essential."},
 {topic:"AUTONOMOUS SYSTEMS",q:"What does an autonomous robot generally do?",a:["Always wait for every small command","Sense its environment and make decisions within its design","Work without any software","Avoid using sensors"],c:1,e:"Autonomous systems use sensors, software, and decision-making methods to perform tasks with limited direct control."},
 {topic:"AUTONOMOUS SYSTEMS",q:"Which sensor is commonly used by autonomous vehicles to detect distance or obstacles?",a:["LiDAR","Speaker","Keyboard","Printer"],c:0,e:"LiDAR uses laser pulses to measure distances and help create an understanding of surroundings."},
 {topic:"AUTONOMOUS SYSTEMS",q:"A self-driving delivery robot detects a person and stops. Which ability is being used?",a:["Obstacle detection and navigation","Paper formatting","Audio mixing","Battery painting"],c:0,e:"The robot uses perception and navigation systems to detect obstacles and respond safely."},
 {topic:"AUTONOMOUS SYSTEMS",q:"Which combination is important for an autonomous robot to work effectively?",a:["Sensors, processing, and control","Only a metal body","Only a battery","Only a camera lens"],c:0,e:"Autonomous robots generally combine sensing, computation, decision-making, and control mechanisms."}
];

let index=0,score=0,answered=false,history=[];
const $=id=>document.getElementById(id);
function render(){
 const q=questions[index]; answered=false;
 $("counter").textContent=`QUESTION ${String(index+1).padStart(2,"0")} / ${questions.length}`;
 $("score").textContent=`SCORE: ${score}`;
 $("progress").style.width=((index+1)/questions.length*100)+"%";
 $("topic").textContent=q.topic;
 $("question").textContent=q.q;
 $("speech").textContent=index===0?"Hello, future engineers! Let's test your robotics knowledge.":`Question ${index+1} activated. Choose the correct answer!`;
 $("feedback").textContent=""; $("feedback").className="feedback";
 $("next").disabled=true;
 $("next").textContent=index===questions.length-1?"View Results →":"Next Question →";
 $("answers").innerHTML="";
 q.a.forEach((answer,i)=>{
   const btn=document.createElement("button");
   btn.className="answer";
   btn.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${answer}</span>`;
   btn.onclick=()=>choose(i,btn);
   $("answers").appendChild(btn);
 });
}
function choose(choice,button){
 if(answered)return;
 answered=true;
 const q=questions[index];
 [...$("answers").children].forEach((b,i)=>{
   b.disabled=true;
   if(i===q.c)b.classList.add("correct");
 });
 if(choice===q.c){
   score++; button.classList.add("correct");
   $("feedback").className="feedback good";
   $("feedback").textContent="✓ Correct! "+q.e;
 }else{
   button.classList.add("wrong");
   $("feedback").className="feedback bad";
   $("feedback").textContent="✕ Not quite. Correct answer: "+q.a[q.c]+". "+q.e;
 }
 $("score").textContent=`SCORE: ${score}`;
 $("next").disabled=false;
 history.push({q:q.q,choice,correct:q.c});
}
function nextQuestion(){
 if(!answered)return;
 if(index<questions.length-1){index++;render();}else{showResults();}
}
function showResults(){
 $("quizPanel").classList.add("hidden");
 $("resultPanel").classList.remove("hidden");
 const percent=Math.round(score/questions.length*100);
 $("resultText").textContent=`You scored ${score} out of ${questions.length} (${percent}%). ${percent>=75?"Excellent work, future engineer!":"Keep exploring robotics and try again to improve your score."}`;
 $("review").innerHTML="<strong>Quick revision</strong>"+questions.map((q,i)=>`<div><b>${i+1}. ${q.topic}</b><br>${q.a[q.c]}</div>`).join("");

 window.finalScore=score;
 window.totalQuestions=questions.length;
 $("submitStatus").textContent="";
 $("scoreName").value="";
 $("scoreName").focus();
}

function submitScore(){
 const input=$("scoreName");
 const status=$("submitStatus");
 const btn=$("submitScoreBtn");
 const name=(input.value.trim() || "Anonymous").slice(0,50);

 const formUrl="https://docs.google.com/forms/d/e/1FAIpQLSd-FyvNOdy9gV9przvAGmzw1Q3tyIVvDSD5bNRwqNuUanWJcQ/formResponse";
 const data=new URLSearchParams();
 data.append("entry.922638768",name);
 data.append("entry.1209659109",String(window.finalScore||0));
 data.append("entry.353662563",String(window.totalQuestions||questions.length));

 btn.disabled=true;
 btn.textContent="Submitting...";
 status.textContent="Saving your score...";

 fetch(formUrl,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body:data.toString()
 }).then(()=>{
   status.textContent="Score submitted! ✓";
   btn.textContent="Score Submitted";
 }).catch(()=>{
   status.textContent="Could not submit automatically. Please try again.";
   btn.disabled=false;
   btn.textContent="Submit Score";
 });
}

function restartQuiz(){
 index=0;score=0;history=[];
 $("quizPanel").classList.remove("hidden");$("resultPanel").classList.add("hidden");
 render();
}
render();
</script>
</body>
</html>
